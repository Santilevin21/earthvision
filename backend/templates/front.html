<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Earth Engine - Proyecto Agroindustria</title>
</head>
<body>

    <h1>Prueba Earth Engine — Sentinel-2</h1>
    <p class="sub">Proyecto Agroindustria · Imagen satelital real de 100×100 m (1 hectárea)</p>

    <div class="imagen-box" id="caja">
        <span class="cargando" id="estado"></span>
    </div>

    <button id="btn" onclick="cargarZona()">Zona aleatoria</button>

        <p class="datos" id="coords">Coordenadas: —</p>
        <p style="margin-top:8px; font-size:12.5px; color:#999;">
        Esta imagen viene de <b>Sentinel-2</b> procesada por
        <b>Google Earth Engine</b> en el backend</p>

    <script>

        async function cargarZona() {
            const btn = document.getElementById('btn');
            const estado = document.getElementById('estado');
            const caja = document.getElementById('caja');
            const coords = document.getElementById('coords');

            btn.disabled = true;
            caja.innerHTML = '<span class="cargando">Pidiendo imagen a Earth Engine…</span>';

            try {
                const resp = await fetch('/api/zona-aleatoria');
                const data = await resp.json();

                if (data.ok) {
                    caja.innerHTML = '<img src="' + data.url + '" alt="Imagen satelital">';
                    coords.textContent =
                        `Coordenadas: ${data.lat}, ${data.lng}  ·  ${data.nombre}`;
                } else {
                    caja.innerHTML = '<span class="error">Error: ' + data.error + '</span>';
                }
            } catch (e) {
            }

            btn.disabled = false;
        }
    </script>

</body>
</html>
