<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Vision</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="dashboard-container">
        <aside class="panel-izquierdo">
            <header class="header-izquierdo">
                <div class="bloque-gris logo">LOGO</div>
                <nav class="bloque-gris selector-hectarea">Hectarea 1</nav>
                <div class="bloque-gris cuadrado-chico"></div>
            </header>
            
            <section class="tarjeta-datos">
                <div class="bloque-gris titulo-datos">Datos</div>
                
                <table class="tabla-metricas">
                    <thead>
                        <tr class="fila-tabla">
                            <th class="bloque-gris col-texto">texto</th>
                            <th class="bloque-gris col-crecimiento">Crecimiento o<br>decrecimiento</th>
                            <th class="bloque-gris col-porcentaje">%</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="fila-tabla">
                            <td class="bloque-gris col-texto">texto</td>
                            <td class="bloque-gris col-crecimiento">Crecimiento o<br>decrecimiento</td>
                            <td class="bloque-gris col-porcentaje">%</td>
                        </tr>
                        <tr class="fila-tabla">
                            <td class="bloque-gris col-texto">texto</td>
                            <td class="bloque-gris col-crecimiento">Crecimiento o<br>decrecimiento</td>
                            <td class="bloque-gris col-porcentaje">%</td>
                        </tr>
                        <tr class="fila-tabla">
                            <td class="bloque-gris col-texto">texto</td>
                            <td class="bloque-gris col-crecimiento">Crecimiento o<br>decrecimiento</td>
                            <td class="bloque-gris col-porcentaje">%</td>
                        </tr>
                        <tr class="fila-tabla">
                            <td class="bloque-gris col-texto">texto</td>
                            <td class="bloque-gris col-crecimiento">Crecimiento o<br>decrecimiento</td>
                            <td class="bloque-gris col-porcentaje">%</td>
                        </tr>
                        <tr class="fila-tabla">
                            <td class="bloque-gris col-texto">texto</td>
                            <td class="bloque-gris col-crecimiento">Crecimiento o<br>decrecimiento</td>
                            <td class="bloque-gris col-porcentaje">%</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </aside>

        <section class="panel-derecho">
            <div class="bloque-gris filtro-fecha">Fecha</div>
            
            <nav class="barra-tiempo">
                <button type="button" class="bloque-gris btn-tiempo">24 horas</button>
                <button type="button" class="bloque-gris btn-tiempo">7 dias</button>
                <button type="button" class="bloque-gris btn-tiempo">30 dias</button>
                <button type="button" class="bloque-gris btn-tiempo">1 año</button>
                <button type="button" class="bloque-gris btn-cuadrado"></button>
            </nav>
            
            <article class="contenedor-mapa">
                Mapa
            </article>
        </section>
    </main>
</body>
</html>
