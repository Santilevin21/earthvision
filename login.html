<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Vision</title>
    <link rel="stylesheet" href="login.css">
    
    <!-- LEAFLET MAPS API (Gratuito y rápido) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js" defer></script>
    <script src="animation.js" defer></script>
</head>
<body>

    <div class="page-wrapper" id="pageWrapper">

        <span class="deco deco-top-left">measurement</span>
        <span class="deco deco-top-right">simplify</span>
        <span class="deco deco-bottom-left">streamline</span>
        <span class="deco deco-bottom-right">efficiency</span>

        <div class="intro-section" id="introSection">
            <h1 class="intro-title">
                <span class="intro-line intro-line-1">“Solutions that</span>
                <span class="intro-line intro-line-2">Simplify”</span>
            </h1>
            <div class="brand-badge">
                <img src="logo.png" alt="Field Vision" class="brand-badge-img">
            </div>
        </div>

        <div class="login-container" id="loginCard">

            <div class="logo-box">
                <img src="logo.png" alt="Field Vision" class="logo-img">
            </div>

            <div class="signup-row" id="signupRow">
                <span class="avatar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="#ffffff">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                    </svg>
                </span>
                <button type="button" id="triggerSignup" class="signup-trigger-btn">Sing-up</button>
            </div>

            <button type="button" class="login-tab" id="loginTab">Login</button>

            <input type="text" id="username" placeholder="E-Mail">
            <input type="password" id="password" placeholder="Password">

            <div class="extra-fields" id="extraFields">
                <input type="password" id="repeat-password" placeholder="Repeat-password">
                
                <!-- BOTON MAPA -->
                <button type="button" id="btn-open-map" class="btn-map-fluor">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
                    Select Field Area (m²)
                </button>

                <input type="text" id="field-area" placeholder="Field-Area-m²" readonly>
                <input type="text" id="field-coordinates" placeholder="Field-Coordinates" readonly>
            </div>

            <button id="hectarea" class="signup-btn">Login</button>
        </div>

    </div>

    <!-- MODAL MAPA -->
    <div id="map-modal" class="map-modal-overlay">
        <div class="map-card">
            <div class="map-card-header">
                <span>Haz clic en el mapa para obtener el área</span>
                <button type="button" id="btn-close-map" class="map-close-btn">&times;</button>
            </div>
            <div id="map-container"></div>
        </div>
    </div>

    <h3 id="response">...</h3>

</body>
</html>
